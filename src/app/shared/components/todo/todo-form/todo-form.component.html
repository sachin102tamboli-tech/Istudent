
<div class="card mt-5">
    <div class="card-header">
        TODO Item
    </div>
    <div class="card-body">
        <form #toForm="ngForm" (ngSubmit)="onSubmit()">
            <div class="form-group">
                <label for="title">Title*</label>
                <input type="text" name="title" required ngModel class="form-control">
                <label for="status" class="mt-3">Status*</label>
                <select [(ngModel)]="todoStatus" name="isCompleted" type="text" class="form-control">
                    <option [ngValue]="true">Completed</option>
                    <option [ngValue]="false">Pending</option>
                </select>
            </div>
            <div class="mt-3">
                <button *ngIf="!isInEditMode" type="submit"  class="btn btn-block btn-outline-primary">Add Todo </button>
                <button *ngIf="isInEditMode" type="button" (click)="onUpdt()" class="btn btn-block btn-outline-primary">Update Todo </button>
            </div>
        </form>
    </div>
</div>
